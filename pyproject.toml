[project]
name = "promptforge"
version = "1.2.0"
description = "提示词工坊 - 一键增强提示词的 Windows 桌面工具（PySide6 + OpenAI 兼容接口 + SQLite 历史）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Liu" }]
keywords = ["prompt-engineering", "llm", "pyside6", "openai", "desktop-app"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: General",
    "Topic :: Utilities",
]
dependencies = [
    "PySide6>=6.5",
    "requests>=2.31",
]

# 注意：本仓库是 monorepo，llmclient 是同仓库内的独立可安装包
# （llmclient/，未发布到 PyPI）。安装顺序：
#     pip install -e ./llmclient && pip install -e .
# 或用 requirements.txt（已含 -e ./llmclient）。
# 不列入 dependencies 是为了避免在 PyPI 上找不到该包导致安装失败；
# promptforge/llm_client.py 内置了路径回退，从仓库根直接
# `python run.py` 无需安装也能工作。

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pyinstaller>=6.0",
]

[project.scripts]
promptforge = "promptforge.app:main"

[project.urls]
Homepage = "https://github.com/383827453-max/PromptForge"
Repository = "https://github.com/383827453-max/PromptForge"
Issues = "https://github.com/383827453-max/PromptForge/issues"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["promptforge", "promptforge.ui"]

[tool.setuptools.package-data]
promptforge = ["strategies/*.md", "templates_builtin/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",
    # 项目声明 requires-python >= 3.9，而 UP006/UP035/UP045 会把
    # typing.List / Optional 改写成 list / X | Y —— 后者是 3.10 语法，
    # 在 3.9 上直接 SyntaxError。保持 py39 兼容，显式关闭这几条。
    "UP006",
    "UP035",
    "UP045",
    # UP015 建议去掉 open() 的 "r" 模式，纯风格且降低可读性
    "UP015",
    # 文件已用 from __future__ import annotations，UP037 会去引号但对 py3.9 无收益
    "UP037",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E731"]

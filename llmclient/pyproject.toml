[project]
name = "llmclient"
version = "0.1.0"
description = "OpenAI 兼容接口的最小客户端：SSE 流式、端点探测、面向用户的错误诊断"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Liu" }]
keywords = ["openai", "llm", "sse", "streaming", "client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/383827453-max/PromptForge"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# src layout：包放在 src/llmclient/，避免在仓库根直接 `import llmclient`
# 时命中同名文件夹（namespace package）而拿不到真正的包。
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
